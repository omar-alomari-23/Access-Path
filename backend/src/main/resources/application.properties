# Server
server.port=${BACKEND_PORT:8080}

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:accesspath}
spring.datasource.username=${DB_USER:accesspath_user}
spring.datasource.password=${DB_PASSWORD:accesspath_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# JWT
jwt.secret=${JWT_SECRET:defaultsecretfordevonly32charsmin}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS — Vite dev server runs on 5173; override via FRONTEND_URL env var in production
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Logging
logging.level.com.accesspath=DEBUG
logging.level.org.springframework.security=INFO

# Jackson date formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# JPA open-in-view warning suppression
spring.jpa.open-in-view=false
